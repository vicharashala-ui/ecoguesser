<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google-site-verification" content="sw-Q45nm5TWrT1Bk9_kBA3dEM13K4XbNqTx30xXsDmI" />
    <title>EcoGuesser — India Protected Areas Geography Guessing Game</title>

    <!-- Sets [data-theme] before index.css's first paint, so dark-mode
         players never see a light flash while React/main.jsx are still
         loading. External file, not inlined: CSP is `script-src 'self'`
         with no 'unsafe-inline', so an inline script here would be
         silently blocked in production (see theme-init.js). Blocking
         (no defer/async) is intentional -- same reason #eg-splash below
         is inlined, it can't wait on a paint to already have happened. -->
    <script src="/theme-init.js"></script>

    <!-- Preconnect to the one remaining third-party origin MapLibre fetches
         from on first paint: tiles.openfreemap.org (vector tiles, glyphs --
         public/map-style.json). Without this the browser doesn't start
         DNS/TCP/TLS setup until MapLibre's own JS has downloaded, parsed,
         and run -- this hint lets that handshake happen in parallel with
         the JS fetch instead of after it. crossorigin is required on the
         preconnect even though this isn't fetched with credentials, since
         font/tile CORS requests are treated as a distinct connection from a
         plain one. dns-prefetch is a same-line fallback for browsers that
         don't support preconnect. Both the /tiles/ ArcGIS proxy and the
         /tiles/dem/ Terrarium DEM proxy are same-origin (Cloudflare Pages
         Functions) and need no hint -- the DEM source used to be a direct
         s3.amazonaws.com fetch (its own preconnect lived here), until it was
         moved behind the same edge-caching proxy pattern as satellite. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />

    <!-- The OpenFreeMap TileJSON document itself, not just its origin:
         map-style.json's vector source uses TileJSON indirection
         (sources.openmaptiles.url), so MapLibre must fetch and parse
         /planet before it can issue a single tile or glyph request -- a
         full round trip serialized behind "JS downloaded, parsed, map
         constructed". The preconnect above only warms the TLS handshake;
         this starts the actual request at HTML-parse time so the response
         is (usually) already sitting in the preload cache by the time
         MapLibre asks for it. crossorigin="anonymous" matches MapLibre's
         own fetch (mode: cors, credentials: same-origin -- its Request
         constructor defaults) -- same mode-mismatch/double-fetch gotcha
         already documented on the map-style.json preload below.
         Deliberately NOT inlined as a tiles:[...] array in map-style.json
         instead: OpenFreeMap's tile URLs embed rotating deployment paths,
         and the TileJSON URL is the stable contract -- inlining would
         break silently on their next deployment rotation. -->
    <link rel="preload" href="https://tiles.openfreemap.org/planet" as="fetch" crossorigin="anonymous" fetchpriority="high" />

    <!-- map-style.json itself, not just the origins above: MapContainer.jsx
         fetches this in application code now (style is fetched-then-patched
         via styleTransform before the map is constructed, rather than handed
         to MapLibre as a URL), so the request only starts once React has
         mounted and that effect has run -- later than it needs to.
         crossorigin="anonymous" is required even though this is same-origin:
         per spec, a preload's credentials mode is "omit" unless crossorigin
         is present (any value), while a plain fetch() defaults to
         "same-origin" credentials -- omitting it here caused Chrome to treat
         this as a mode mismatch and issue the request twice (confirmed via
         a real preload-vs-fetch console warning during verification), the
         opposite of the intended effect. fetchpriority nudges it ahead of
         same-priority-class requests it'd otherwise queue behind. -->
    <link rel="preload" href="/map-style.json" as="fetch" crossorigin="anonymous" fetchpriority="high" />

    <!-- /api/daily-manifest: today's 5 Daily sites, precomputed server-side
         (see functions/_shared/handlers.js) instead of derived client-side
         from the full 837-site catalog below. Daily is the default tab, so
         this -- not protected-areas.json -- is what actually gates the
         "Loading today's challenge..." pill on first visit. Same
         crossorigin="anonymous" requirement as map-style.json above (see
         that comment): App.jsx's fetch() call defaults to "same-origin"
         credentials, so this preload needs crossorigin present (any value)
         to avoid a mode-mismatch double-fetch, even though the request
         itself is same-origin. -->
    <link rel="preload" href="/api/daily-manifest" as="fetch" crossorigin="anonymous" fetchpriority="high" />

    <!-- protected-areas.json: still needed for Classic/Blitz (any-site
         random pool) and StatsView, but no longer gates Daily's first round
         now that /api/daily-manifest above exists -- demoted from
         fetchpriority="high" so it doesn't compete with that request for
         bandwidth on exactly the slow connections this split is meant to
         help. Still worth preloading rather than dropping: App.jsx's
         loadSites() fetch()es it in a mount effect, so without any preload
         the request wouldn't start until ~360KB gzip of JS has downloaded,
         parsed, and React has committed. Same crossorigin="anonymous"
         requirement as map-style.json above (see that comment); same
         stable unhashed public/ URL, so nothing to rewrite at build time. -->
    <link rel="preload" href="/protected-areas.json" as="fetch" crossorigin="anonymous" fetchpriority="low" />

    <!-- Nunito 400/700/800 (src/index.css's @fontsource imports) -- all
         three weights actually visible on first paint, not just 400: the
         Header wordmark is 800, its tagline and BottomNav labels are 700,
         and Daily's Start button/timer (the first interactive thing under
         the splash) are 700/800 too. 400 is preloaded on its own for the
         reason below (nothing names it, so it's undiscoverable without
         help); 700/800 are ALSO preloaded despite being named in explicit
         CSS selectors -- "discoverable eventually via CSSOM match" isn't
         the same as "loads at preload priority", and those two weights are
         exactly what's on screen the instant the splash fades. Skipping
         them was the gap: the moment this preload block is trying to
         protect (splash -> reveal) is the same moment the bold brand text
         would otherwise flash in a fallback font. No fetchpriority on any
         of the three -- deliberately below map-style.json/OFM-planet's
         explicit "high" above, so they don't dilute those two off the
         critical map-render path. Paths are the source npm-package files,
         not the hashed dist filenames -- Vite's asset pipeline rewrites
         these hrefs to the real hashed output paths at build time, same
         mechanism as any other asset reference in this file. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/nunito/files/nunito-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2" />

    <!-- Favicon: multi-res .ico covers old browsers; PNG/SVG variants below
         are what modern Chrome/Firefox tab bars and bookmarks actually
         prefer. All are white tiger-head-on-#1c3b28 (see
         src/components/tigerMarkPath.js + BASE_VISUAL.BOUNDARY_COLOR). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#1c3b28" />

    <!-- iOS home-screen icon -- Apple ignores manifest.json icons entirely,
         so this is required separately from the Web Manifest below for
         "Add to Home Screen" to pick up the right artwork. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EcoGuesser" />

    <!-- Browser chrome / task-switcher tint on Android + install prompt --
         same dark green as the icon background. -->
    <meta name="theme-color" content="#1c3b28" />
    <meta name="description" content="Guess India's national parks, wildlife sanctuaries, tiger reserves, biosphere reserves, and Ramsar wetlands from the map." />

    <!-- Canonical + social preview tags. og-image.png (public/og-image.png)
         is a purpose-built 1200x630 share card -- tiger mark + wordmark +
         faint India-outline watermark, reusing indiaOutline.js's silhouette
         and the same brand palette as Header.jsx. Regenerate by re-running
         the wkhtmltoimage render if the brand mark or copy changes. -->
    <link rel="canonical" href="https://ecoguesser.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ecoguesser.pages.dev/" />
    <meta property="og:title" content="EcoGuesser — India Protected Areas Geography Guessing Game" />
    <meta property="og:description" content="Guess India's national parks, wildlife sanctuaries, tiger reserves, biosphere reserves, and Ramsar wetlands from the map." />
    <meta property="og:image" content="https://ecoguesser.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EcoGuesser — India Protected Areas Geography Guessing Game" />
    <meta name="twitter:description" content="Guess India's national parks, wildlife sanctuaries, tiger reserves, biosphere reserves, and Ramsar wetlands from the map." />
    <meta name="twitter:image" content="https://ecoguesser.pages.dev/og-image.png" />

    <!-- JSON-LD: tells Google this is a playable game, not just a generic
         page -- eligible for richer treatment in search results than plain
         blue-link + snippet. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "EcoGuesser",
        "url": "https://ecoguesser.pages.dev/",
        "description": "Guess India's national parks, wildlife sanctuaries, tiger reserves, biosphere reserves, and Ramsar wetlands from the map.",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- manifest.webmanifest itself is generated + injected by
         vite-plugin-pwa at build time; no manual <link rel="manifest">
         needed here. -->

    <!-- Splash overlay (#eg-splash below): preloaded so the icon request
         starts at the same priority as the document itself, instead of
         waiting to be discovered when the browser parses the <img> tag
         further down in <body>. -->
    <link rel="preload" as="image" href="/icons/icon-192.png" />

    <!-- Inlined, not in index.css: this has to paint before any stylesheet
         (even a small one) has had a chance to load, since its entire job
         is covering the gap between "HTML parsed" and "React has mounted
         the real app underneath it". Anything that makes it depend on a
         network round-trip defeats the point. -->
    <style>
      #eg-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c3b28;
        opacity: 1;
        transition: opacity 320ms ease;
      }
      #eg-splash img {
        width: 25vw;
        max-width: 112px;
        min-width: 72px;
        height: auto;
      }
      #eg-splash.eg-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Purely decorative, static markup+CSS -- it paints the instant the
         HTML parser reaches this point, with zero dependency on the JS
         bundle, index.css, or React. It sits *on top of* #root while the
         real app mounts and starts fetching underneath it (map tiles,
         sites JSON, etc.) at full speed the whole time, so it costs the
         game itself nothing -- see main.jsx for how/when it's removed. -->
    <div id="eg-splash">
      <img src="/icons/icon-192.png" width="192" height="192" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
